name: Täglicher Biowetter-Tipp

on:
  schedule:
    - cron: '0 5 * * *'   #  7 Uhr MEZ (= 5 Uhr UTC)
    - cron: '0 11 * * *'  # 13 Uhr MEZ (= 11 Uhr UTC)
    - cron: '0 16 * * *'  # 18 Uhr MEZ (= 16 Uhr UTC)
  workflow_dispatch:

jobs:
  biowetter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Biowetter-Tipp auswählen
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          from datetime import datetime

          # 1. Wetterdaten holen: Deutscher Wetterdienst (DWD) über Bright Sky (Mitte Deutschland)
          url = "https://api.brightsky.dev/current_weather?lat=51.2&lon=10.5&tz=Europe/Berlin"
          with urllib.request.urlopen(url) as r:
            w = json.load(r)["weather"]

          temp  = round(w["temperature"])
          druck = round(w.get("pressure_msl") or 1013)
          wind  = round(w.get("wind_speed_10") or 0)
          # Bright Sky liefert Symbole statt WMO-Codes: auf die bisherigen Codes abbilden
          icon2code = {
            "clear-day":0, "clear-night":0, "partly-cloudy-day":2, "partly-cloudy-night":2,
            "cloudy":3, "wind":3, "fog":45, "rain":61, "sleet":71, "snow":73,
            "hail":82, "thunderstorm":95
          }
          wcode = icon2code.get(w.get("icon"), 3)
          # Luftdruck: Bright Sky meldet auf Meereshöhe (Tiefdruck ab unter 1005 hPa)
          druck = 990 if druck < 1005 else 1013
          monat = datetime.now().month
          datum = datetime.now().strftime("%d.%m.%Y")
          tag_nr = int(datetime.now().strftime("%j"))  # Tag des Jahres (1-365)

          codes = {
            0:"Klarer Himmel", 1:"Überwiegend klar", 2:"Teils bewölkt",
            3:"Bedeckt", 45:"Nebel", 48:"Nebel", 51:"Nieselregen",
            53:"Nieselregen", 55:"Nieselregen", 61:"Regen", 63:"Regen",
            65:"Starker Regen", 71:"Schneeregen", 73:"Schneefall",
            75:"Schneefall", 80:"Regenschauer", 81:"Regenschauer",
            82:"Hagel", 95:"Gewitter", 96:"Gewitter",
            99:"Schweres Gewitter"
          }
          wetter_text = codes.get(wcode, "Wechselhaft")

          # 2. Kategorie bestimmen
          regen_codes  = {51,53,55,61,63,65,80,81,82}
          gewitter_codes = {95,96,99}
          nebel_codes  = {45,48}
          schnee_codes = {71,73,75}

          if wcode in gewitter_codes:
            kategorie = "gewitter"
          elif wcode in nebel_codes:
            kategorie = "nebel"
          elif wcode in regen_codes or wcode in schnee_codes:
            if temp < 5:
              kategorie = "kalt"
            else:
              kategorie = "regen"
          elif wind > 40:
            kategorie = "wind"
          elif temp >= 33:
            kategorie = "sehr_heiss"
          elif temp >= 28:
            kategorie = "hitze"
          elif temp <= -5:
            kategorie = "sehr_kalt"
          elif temp <= 5:
            kategorie = "kalt"
          elif druck < 1000:
            kategorie = "luftdruck_tief"
          elif wcode in {0,1} and 8 <= temp <= 27:
            kategorie = "sonnig_mild"
          elif monat in {3,4,5}:
            kategorie = "fruehling"
          elif monat in {9,10,11}:
            kategorie = "herbst"
          elif monat in {12,1,2}:
            kategorie = "winter"
          elif wcode in {2,3}:
            kategorie = "bedeckt_mild"
          else:
            kategorie = "standard"

          # 3. Tipp aus JSON auswählen (deterministisch per Tag des Jahres)
          with open("gesundheitstipps.json", encoding="utf-8") as f:
            tipps = json.load(f)

          liste = tipps.get(kategorie, tipps["standard"])
          tipp  = liste[tag_nr % len(liste)]

          # 4. biowetter.json schreiben
          data = {
            "datum": datum,
            "wetter": wetter_text,
            "temperatur": str(temp),
            "tipp": tipp
          }
          with open("biowetter.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"Kategorie: {kategorie} | Wetter: {wetter_text} | {temp}°C")
          print(f"Tipp: {tipp[:80]}...")
          PYEOF

      - name: Änderungen committen
        run: |
          git config user.name "Biowetter-Bot"
          git config user.email "bot@verlagshausrathmer.com"
          git add biowetter.json
          git diff --cached --quiet || git commit -m "Biowetter-Tipp $(date '+%d.%m.%Y')"
          git push
